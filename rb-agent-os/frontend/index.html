<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RB Agent OS — Autonomous Personal AI</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/reactor.css">
</head>
<body>
  <div id="app">
    <!-- 1. Compact Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="btn-menu" class="icon-btn" aria-label="Open Settings and Secondary Screens">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="app-title-group">
          <span class="app-title">RB Agent OS</span>
          <span class="app-subtitle">Ram Binay Kumar Pandit</span>
        </div>
      </div>
      <div class="top-bar-right">
        <div class="status-badge">
          <span id="connection-status-dot" class="status-dot"></span>
          <span id="connection-status-text">Online</span>
        </div>
      </div>
    </header>

    <!-- 2. Main Viewport -->
    <main class="main-viewport">
      <!-- Greeting Section -->
      <section class="greeting-section">
        <h1 id="greeting-text" class="personalized-greeting">नमस्ते, Ram Binay, आज आपका क्या प्लान है?</h1>
      </section>

      <!-- Central Planetary Reactor -->
      <section class="reactor-wrapper" aria-label="Central Planetary Reactor Core">
        <div id="reactor-container" class="reactor-container" title="Tap to toggle voice listening">
          <div class="reactor-aura"></div>
          <div class="orbital-ring ring-outer"></div>
          <div class="orbital-ring ring-mid"></div>
          <div class="orbital-ring ring-inner"></div>
          <div class="reactor-core">
            <div class="core-grid"></div>
            <span class="core-label">RB Agent</span>
            <span class="core-sublabel">ENERGY CORE</span>
          </div>
        </div>
      </section>

      <!-- Status Indicator -->
      <div style="margin-bottom: 14px; text-align: center;">
        <span id="reactor-status-text" style="font-size: 0.78rem; font-weight: 600; color: #64748b; letter-spacing: 0.04em;">RB Agent Core Online</span>
      </div>

      <!-- Expandable Conversation Stream -->
      <section id="conversation-stream" class="conversation-panel" aria-live="polite">
        <!-- Message bubbles populated here dynamically -->
      </section>
    </main>

    <!-- 3. Fixed Bottom Dock -->
    <footer class="bottom-dock">
      <div class="dock-meta-bar">
        <span>Active Model:</span>
        <span id="active-model-name" class="active-model-tag" title="Tap to switch model">gemini-1.5-flash</span>
      </div>
      <div class="dock-input-bar">
        <!-- Attachment Button -->
        <button id="btn-attach" class="icon-btn" aria-label="Attach File" onclick="alert('Supported attachments: .txt, .py, .json from workspace.')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>

        <!-- Chat Input -->
        <textarea id="chat-input" class="chat-input" rows="1" placeholder="ASK RB Agent...."></textarea>

        <!-- Voice Conversation Button -->
        <button id="btn-voice-mode" class="icon-btn" aria-label="Two-Way Voice Mode" title="Two-Way Voice Conversation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </button>

        <!-- Push to Talk Mic Button -->
        <button id="btn-mic" class="action-btn btn-mic" aria-label="Microphone Voice Input" title="Toggle Microphone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Send Button -->
        <button id="btn-send" class="action-btn btn-send" aria-label="Send Message" title="Send Request">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- 4. Secondary Screens Drawer -->
    <div id="settings-drawer" class="drawer-backdrop" aria-hidden="true">
      <div class="drawer-content">
        <div class="drawer-header">
          <h2>RB Agent Controls</h2>
          <button id="btn-close-drawer" class="icon-btn" aria-label="Close Controls">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <nav class="drawer-nav">
          <button class="drawer-tab active" data-tab="preferences">Settings</button>
          <button class="drawer-tab" data-tab="history">History</button>
          <button class="drawer-tab" data-tab="device">Android/Termux</button>
          <button class="drawer-tab" data-tab="memory">Memory</button>
          <button class="drawer-tab" data-tab="learning">Training & Stats</button>
          <button class="drawer-tab" data-tab="sync">Cloud Sync</button>
        </nav>
        <div id="drawer-body-content" class="drawer-body">
          <!-- Populated dynamically by settings.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="/static/js/reactor.js"></script>
  <script src="/static/js/voice.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/pwa.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
