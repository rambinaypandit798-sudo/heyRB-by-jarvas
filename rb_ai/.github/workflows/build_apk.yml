name: Build RB Agent Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: flutter_client
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_client
        run: flutter build apk --release --no-tree-shake-icons

      - name: Stage Release APK
        run: |
          mkdir -p release_output
          cp flutter_client/build/app/outputs/flutter-apk/app-release.apk release_output/RB-Agent-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RB-Agent-release-apk
          path: release_output/RB-Agent-release.apk
          if-no-files-found: error
